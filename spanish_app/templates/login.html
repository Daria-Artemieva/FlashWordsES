<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Spanish Words</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page auth-page">
    <section class="card">
      <h1>Login</h1>
      <p class="subtitle">Sign in to access your personal word list.</p>

      {% if error %}
        <div class="message-box error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" class="word-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Login</button>
      </form>

      <p class="auth-links">
        No account?
        <a href="{{ url_for('register') }}">Create one</a>
      </p>
    </section>
  </main>
</body>
</html>
